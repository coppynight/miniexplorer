<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coze Realtime API POC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: #333; margin-bottom: 20px; }
    .section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .section h2 {
      font-size: 16px;
      color: #666;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 5px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    input[type="checkbox"] {
      width: auto;
      accent-color: #4A90D9;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #4A90D9;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #4A90D9;
      color: white;
    }
    .btn-primary:hover { background: #3A7BC8; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-danger {
      background: #e74c3c;
      color: white;
    }
    .btn-danger:hover { background: #c0392b; }
    .btn-success {
      background: #27ae60;
      color: white;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status.disconnected { background: #fee; color: #c0392b; }
    .status.connecting { background: #fff3cd; color: #856404; }
    .status.connected { background: #d4edda; color: #155724; }
    .log-container {
      background: #1a1a2e;
      border-radius: 8px;
      padding: 15px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 12px;
    }
    .log-entry {
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .log-entry.info { color: #7ec8e3; }
    .log-entry.success { color: #98e4c9; }
    .log-entry.error { color: #ff6b6b; }
    .log-entry.warning { color: #ffd166; }
    .log-entry.event { color: #f5a962; }
    .log-entry .time { color: #666; margin-right: 8px; }
    .result-box {
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }
    .result-box.success { background: #d4edda; color: #155724; }
    .result-box.error { background: #f8d7da; color: #721c24; }
    .result-box.warning { background: #fff3cd; color: #856404; }
    .checklist {
      list-style: none;
    }
    .checklist li {
      padding: 8px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .checklist .icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .checklist .icon.pending { background: #eee; color: #999; }
    .checklist .icon.pass { background: #d4edda; color: #155724; }
    .checklist .icon.fail { background: #f8d7da; color: #721c24; }
    #local-player {
      position: relative;
      overflow: hidden;
    }
    #local-player video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      display: block;
    }
    .inline-option {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
      font-size: 13px;
      user-select: none;
    }
    .log-tools {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .btn-light {
      background: #ecf0f1;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <h1>Coze Realtime API POC</h1>

  <!-- 配置区 -->
  <div class="section">
    <h2>1. 配置</h2>
    <div class="form-group">
      <label>API Base URL</label>
      <select id="baseUrl">
        <option value="https://api.coze.cn">https://api.coze.cn (国内)</option>
        <option value="https://api.coze.com">https://api.coze.com (国际)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Access Token (Personal Access Token)</label>
      <input type="password" id="accessToken" placeholder="pat_xxxxxxxx">
    </div>
    <div class="form-group">
      <label>Bot ID</label>
      <input type="text" id="botId" placeholder="7xxxxxxxxxxxxxxxxx">
    </div>
    <div class="form-group">
      <label>Voice ID (可选)</label>
      <input type="text" id="voiceId" placeholder="留空使用默认语音">
    </div>
  </div>

  <!-- 测试区 -->
  <div class="section">
    <h2>2. 测试</h2>
    <p style="margin-bottom: 15px;">
      连接状态: <span id="status" class="status disconnected">未连接</span>
    </p>
    <div class="btn-group">
      <button class="btn btn-primary" id="btnConnect" onclick="testConnect()">连接</button>
      <button class="btn btn-danger" id="btnDisconnect" onclick="testDisconnect()" disabled>断开</button>
      <button class="btn btn-success" id="btnMic" onclick="toggleMic()" disabled>开启麦克风</button>
      <button class="btn btn-success" id="btnVideo" onclick="toggleVideo()" disabled>开启视频</button>
      <button class="btn btn-success" id="btnSnap" onclick="captureAndSendFrame()" disabled>抓拍发送</button>
    </div>
    <label class="inline-option">
      <input type="checkbox" id="autoVision" checked>
      语音联动视觉（说话时 1 秒 1 帧）
    </label>
  </div>

  <!-- 视频预览 -->
  <div class="section">
    <h2>2.1 视频预览</h2>
    <p style="margin-bottom: 10px; color: #666;">如开启视频，画面将显示在下方（renderDom: local-player）</p>
    <div id="local-player" style="width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px;"></div>
  </div>

  <!-- 验证清单 -->
  <div class="section">
    <h2>3. 验证清单</h2>
    <ul class="checklist">
      <li>
        <span class="icon pending" id="check1">-</span>
        <span>SDK 可在浏览器加载</span>
      </li>
      <li>
        <span class="icon pending" id="check2">-</span>
        <span>可获取麦克风权限</span>
      </li>
      <li>
        <span class="icon pending" id="check2v">-</span>
        <span>可获取摄像头权限</span>
      </li>
      <li>
        <span class="icon pending" id="check3">-</span>
        <span>可建立 RTC 连接</span>
      </li>
      <li>
        <span class="icon pending" id="check4">-</span>
        <span>可发送音频流</span>
      </li>
      <li>
        <span class="icon pending" id="check5">-</span>
        <span>可接收 AI 响应</span>
      </li>
      <li>
        <span class="icon pending" id="check6">-</span>
        <span>可发送图片帧并触发视觉理解</span>
      </li>
    </ul>
  </div>

  <!-- 日志 -->
  <div class="section">
    <h2>4. 日志</h2>
    <div class="log-tools">
      <button class="btn btn-light" onclick="exportDebugLogs()">导出日志 JSON</button>
      <button class="btn btn-light" onclick="clearDebugLogs()">清空本地日志</button>
    </div>
    <div class="log-container" id="logContainer">
      <div class="log-entry info"><span class="time">[--:--:--]</span> 等待测试...</div>
    </div>
  </div>

  <!-- 结论 -->
  <div class="section">
    <h2>5. 结论</h2>
    <div id="conclusion">
      <p style="color: #666;">完成测试后将显示结论</p>
    </div>
  </div>

  <script type="module">
    // 动态导入 Coze Realtime SDK
    let RealtimeClient, EventNames, RealtimeUtils;
    let client = null;
    let micEnabled = false;
    let videoEnabled = false;
    let fallbackPreviewStream = null;
    let autoVisionEnabled = true;
    let speechModeActive = false;
    let speechFrameTimer = null;
    let speechFrameInFlight = false;
    let speechUploadedFrameIds = [];
    let speechFlushTimer = null;
    let speechBundleRetryTimer = null;
    let speechBundleInFlight = false;
    let assistantStartedAfterSpeech = false;
    let assistantChatInProgress = false;
    let currentUserSpeechText = '';
    let latestCompletedUserSpeechText = '';
    let speechBundleRetryCount = 0;
    let hasDirectAudioTranscriptBinding = false;
    let hasDirectConversationMessageBinding = false;
    const SPEECH_FRAME_INTERVAL_MS = 1000;
    const SPEECH_FLUSH_DELAY_MS = 320;
    const SPEECH_MAX_FRAMES = 12;
    const SPEECH_UPLOAD_SETTLE_TIMEOUT_MS = 1600;
    const SPEECH_BUNDLE_MAX_RETRY = 1;
    const SPEECH_BUNDLE_RETRY_DELAY_MS = 450;
    const DEBUG_STORAGE_KEY = 'coze_poc_debug_session_v1';
    const DEBUG_MAX_RECORDS = 2000;
    const debugSession = {
      sessionId: (globalThis.crypto?.randomUUID?.() || `sess_${Date.now()}_${Math.random().toString(16).slice(2)}`),
      startedAt: new Date().toISOString(),
      page: location.href,
      userAgent: navigator.userAgent,
      records: []
    };

    function maskToken(token) {
      const t = String(token || '');
      if (!t) return '';
      if (t.length <= 10) return `${t.slice(0, 2)}***`;
      return `${t.slice(0, 4)}***${t.slice(-4)}`;
    }

    function sanitizeValue(value, depth = 0) {
      if (depth > 4) return '[max_depth]';
      if (value == null) return value;
      if (typeof value === 'string') {
        return value.length > 500 ? `${value.slice(0, 500)}...[truncated]` : value;
      }
      if (typeof value !== 'object') return value;
      if (Array.isArray(value)) {
        const arr = value.slice(0, 20).map((v) => sanitizeValue(v, depth + 1));
        if (value.length > 20) arr.push(`[+${value.length - 20} items truncated]`);
        return arr;
      }
      const out = {};
      const keys = Object.keys(value).slice(0, 40);
      for (const k of keys) {
        const lk = k.toLowerCase();
        if (lk.includes('token') || lk.includes('authorization')) {
          out[k] = '[redacted]';
        } else {
          out[k] = sanitizeValue(value[k], depth + 1);
        }
      }
      if (Object.keys(value).length > 40) out.__truncated_keys = Object.keys(value).length - 40;
      return out;
    }

    function persistDebugSession() {
      try {
        localStorage.setItem(DEBUG_STORAGE_KEY, JSON.stringify(debugSession));
      } catch (_) {}
    }

    function appendDebugRecord(kind, payload = {}) {
      const rec = {
        ts: new Date().toISOString(),
        kind,
        payload: sanitizeValue(payload)
      };
      debugSession.records.push(rec);
      if (debugSession.records.length > DEBUG_MAX_RECORDS) {
        debugSession.records = debugSession.records.slice(-DEBUG_MAX_RECORDS);
      }
      persistDebugSession();
    }

    function exportDebugSnapshot() {
      const baseURL = document.getElementById('baseUrl')?.value || '';
      const botId = document.getElementById('botId')?.value?.trim() || '';
      const token = document.getElementById('accessToken')?.value?.trim() || '';
      return {
        exportedAt: new Date().toISOString(),
        session: debugSession,
        runtime: {
          statusText: document.getElementById('status')?.textContent || '',
          autoVisionEnabled,
          speechModeActive,
          micEnabled,
          videoEnabled
        },
        config: {
          baseURL,
          botId,
          accessTokenMasked: maskToken(token)
        }
      };
    }

    window.exportDebugLogs = function() {
      try {
        const snapshot = exportDebugSnapshot();
        const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json' });
        const ts = new Date().toISOString().replace(/[:.]/g, '-');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `coze-poc-debug-${debugSession.sessionId}-${ts}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);
        log('日志已导出到本地下载目录', 'success');
      } catch (e) {
        log(`导出日志失败: ${e.message || e}`, 'error');
      }
    };

    window.clearDebugLogs = function() {
      try {
        localStorage.removeItem(DEBUG_STORAGE_KEY);
        debugSession.records = [];
        persistDebugSession();
        log('本地日志已清空（当前会话重新开始记录）', 'warning');
      } catch (e) {
        log(`清空日志失败: ${e.message || e}`, 'error');
      }
    };

    // 日志函数
    function log(message, type = 'info') {
      const container = document.getElementById('logContainer');
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
      container.appendChild(entry);
      container.scrollTop = container.scrollHeight;
      appendDebugRecord('ui_log', { type, message, time });
    }

    // 更新检查项
    function updateCheck(id, status) {
      const el = document.getElementById(id);
      el.className = `icon ${status}`;
      el.textContent = status === 'pass' ? '✓' : status === 'fail' ? '✗' : '-';
    }

    // 更新状态
    function updateStatus(status) {
      const el = document.getElementById('status');
      el.className = `status ${status}`;
      el.textContent = status === 'connected' ? '已连接' :
                       status === 'connecting' ? '连接中...' : '未连接';
    }

    function setConnectedButtons(connected) {
      document.getElementById('btnConnect').disabled = connected;
      document.getElementById('btnDisconnect').disabled = !connected;
      document.getElementById('btnMic').disabled = !connected;
      document.getElementById('btnVideo').disabled = !connected;
      document.getElementById('btnSnap').disabled = !connected;
    }

    function extractRoleFromEvent(evt) {
      return evt?.data?.role ||
        evt?.data?.message?.role ||
        evt?.role ||
        evt?.message?.role ||
        '';
    }

    function extractEventType(evt) {
      if (typeof evt === 'string') return evt;
      return evt?.event_type ||
        evt?.type ||
        evt?.event?.type ||
        evt?.data?.type ||
        evt?.data?.event_type ||
        evt?.eventType ||
        '';
    }

    function objectKeysSafe(value) {
      return value && typeof value === 'object' ? Object.keys(value) : [];
    }

    function normalizeEventArgs(arg1, arg2, fallbackEventName = '') {
      const eventName = typeof arg1 === 'string' ? arg1 : (extractEventType(arg1) || fallbackEventName);
      const event = arg2 !== undefined ? arg2 : arg1;
      return { eventName, event };
    }

    function extractTextFromObjectString(content) {
      if (typeof content !== 'string') return '';
      try {
        const parsed = JSON.parse(content);
        if (Array.isArray(parsed)) {
          const textItem = parsed.find((x) => x && x.type === 'text' && typeof x.text === 'string');
          return textItem?.text || '';
        }
      } catch (_) {}
      return '';
    }

    function extractTextFromEvent(evt) {
      const candidates = [
        evt?.data?.delta,
        evt?.delta,
        evt?.data?.transcript,
        evt?.data?.text,
        evt?.data?.message?.delta,
        evt?.data?.message?.text,
        evt?.data?.message?.content,
        evt?.data?.content,
        evt?.text
      ];
      for (const c of candidates) {
        if (typeof c === 'string' && c.trim()) {
          const fromObj = extractTextFromObjectString(c);
          return fromObj || c.trim();
        }
        const v = coerceStringFromUnknown(c);
        if (v) return v;
      }
      return '';
    }

    function coerceStringFromUnknown(value) {
      if (!value) return '';
      if (typeof value === 'string') return value.trim();
      if (Array.isArray(value)) {
        const parts = value.map((v) => coerceStringFromUnknown(v)).filter(Boolean);
        return parts.join('');
      }
      if (typeof value === 'object') {
        const keys = ['text', 'delta', 'transcript', 'content', 'value', 'sentence', 'utterance', 'asr_text'];
        for (const k of keys) {
          if (typeof value[k] === 'string' && value[k].trim()) return value[k].trim();
        }
      }
      return '';
    }

    function extractUserTranscriptFromEvent(evt) {
      const data = evt?.data || {};
      const candidates = [
        data.transcript,
        data.delta,
        data.text,
        data.content,
        data.result,
        data.audio_transcript,
        data.value,
        data.message?.transcript,
        data.message?.text,
        data.message?.delta,
        data.message?.content,
        evt?.delta,
        evt?.text,
        evt?.transcript
      ];
      for (const c of candidates) {
        const s = coerceStringFromUnknown(c);
        if (s) return s;
      }
      return '';
    }

    function mergeTranscriptText(prev, next) {
      const a = String(prev || '').trim();
      const b = String(next || '').trim();
      if (!a) return b;
      if (!b) return a;
      if (b.includes(a)) return b;
      if (a.includes(b)) return a;
      if (b.length >= a.length) return b;
      if (a.length <= 120 && b.length <= 40) return `${a}${b}`;
      return a;
    }

    function clearSpeechBundleRetryTimer() {
      if (speechBundleRetryTimer) {
        clearTimeout(speechBundleRetryTimer);
        speechBundleRetryTimer = null;
      }
    }

    function hasPendingSpeechVisualData() {
      return speechUploadedFrameIds.length > 0 || speechFrameInFlight;
    }

    function getSpeechBundleDelay(reason) {
      const r = String(reason || '').toLowerCase();
      if (r.includes('user_text_completed') || r.includes('audio_transcript_completed')) {
        return 80;
      }
      if (r.includes('speech_stopped')) {
        return 280;
      }
      return SPEECH_FLUSH_DELAY_MS;
    }

    function handleUserTranscriptEvent(evt, eventType, source = 'unknown') {
      const tn = String(eventType || '').toLowerCase();
      const transcript = extractUserTranscriptFromEvent(evt);
      if (!transcript) {
        if (evt && typeof evt === 'object') {
          appendDebugRecord('user_transcript_empty', {
            source,
            eventType,
            keys: Object.keys(evt || {}),
            dataKeys: Object.keys((evt && evt.data) || {})
          });
        }
        return false;
      }

      currentUserSpeechText = mergeTranscriptText(currentUserSpeechText, transcript);
      if (tn.includes('completed')) {
        latestCompletedUserSpeechText = currentUserSpeechText;
      }
      appendDebugRecord('user_transcript', {
        source,
        eventType,
        state: tn.includes('completed') ? 'completed' : 'delta',
        textPreview: String(currentUserSpeechText).slice(0, 150)
      });
      if (tn.includes('completed')) {
        log(`用户语音识别(${source}): ${String(currentUserSpeechText).slice(0, 120)}`, 'info');
        if (!speechModeActive && autoVisionEnabled && hasPendingSpeechVisualData()) {
          scheduleSpeechBundleSend('audio_transcript_completed');
        }
      }
      return true;
    }

    function handleConversationMessageEvent(evt, eventType, source = 'unknown') {
      const role = extractRoleFromEvent(evt);
      const guessedRole = (!role && !assistantStartedAfterSpeech && (speechModeActive || speechUploadedFrameIds.length > 0 || speechBundleRetryCount > 0))
        ? 'user'
        : '';
      const resolvedRole = role || guessedRole;
      const text = extractTextFromEvent(evt);
      const tn = String(eventType || '').toLowerCase();
      const isCompleted = tn.includes('completed');

      if (resolvedRole === 'user') {
        if (!text) return false;
        currentUserSpeechText = mergeTranscriptText(currentUserSpeechText, text);
        if (isCompleted) {
          latestCompletedUserSpeechText = currentUserSpeechText;
        }
        appendDebugRecord('user_transcript', {
          source,
          eventType,
          state: isCompleted ? 'completed' : 'delta',
          textPreview: String(currentUserSpeechText).slice(0, 150)
        });
        if (isCompleted) {
          log(`用户语音识别(${source}): ${String(currentUserSpeechText).slice(0, 120)}`, 'info');
          if (!speechModeActive && autoVisionEnabled && hasPendingSpeechVisualData()) {
            scheduleSpeechBundleSend('user_text_completed');
          }
        }
        return true;
      }

      if (text) {
        appendDebugRecord('assistant_text', {
          source,
          eventType,
          textPreview: String(text).slice(0, 200)
        });
        log(`AI 文本: ${String(text).slice(0, 200)}`, 'success');
      }
      if (tn.includes('conversation.message') || tn.includes('response.audio')) {
        updateCheck('check5', 'pass');
      }
      return !!text;
    }

    function bindEventNamesByPattern({ label, patterns, handler }) {
      if (!client || !EventNames || typeof handler !== 'function') return [];
      const eventValues = Object.values(EventNames).filter((v) => typeof v === 'string');
      const lowerPatterns = patterns.map((p) => String(p).toLowerCase());
      const matched = [...new Set(eventValues.filter((name) => {
        const ln = String(name).toLowerCase();
        return lowerPatterns.some((p) => ln.includes(p));
      }))];

      appendDebugRecord('event_bind_scan', { label, patterns, matched });
      if (!matched.length) {
        log(`${label} 未匹配到可绑定事件名`, 'warning');
        return [];
      }

      for (const eventName of matched) {
        client.on(eventName, (arg1, arg2) => {
          const { eventName: dispatchedEventName, event } = normalizeEventArgs(arg1, arg2, eventName);
          appendDebugRecord('server_event_direct', {
            label,
            eventName,
            dispatchedEventName,
            eventType: dispatchedEventName || extractEventType(event) || eventName,
            rawType: typeof event,
            keys: objectKeysSafe(event),
            dataKeys: objectKeysSafe((event && typeof event === 'object') ? event.data : null)
          });
          handler(event, dispatchedEventName || eventName, label);
        });
        appendDebugRecord('event_bound', { label, eventName });
      }
      log(`${label} 已绑定 ${matched.length} 个事件`, 'info');
      return matched;
    }

    function stopSpeechFrameLoop() {
      speechModeActive = false;
      if (speechFrameTimer) {
        clearInterval(speechFrameTimer);
        speechFrameTimer = null;
      }
    }

    function resetSpeechCaptureState() {
      stopSpeechFrameLoop();
      if (speechFlushTimer) {
        clearTimeout(speechFlushTimer);
        speechFlushTimer = null;
      }
      clearSpeechBundleRetryTimer();
      speechUploadedFrameIds = [];
      speechFrameInFlight = false;
      speechBundleInFlight = false;
      assistantStartedAfterSpeech = false;
      assistantChatInProgress = false;
      currentUserSpeechText = '';
      speechBundleRetryCount = 0;
    }

    async function captureAndUploadCurrentFrame(reason = 'speech_loop') {
      if (!videoEnabled) throw new Error('video_not_enabled');
      const { baseURL, accessToken } = getAccessConfig();
      const video = await waitForLocalVideo(800);
      if (!video) throw new Error('local_video_not_ready');
      const blob = await captureFrameBlob(video);
      const fileId = await uploadImageToCoze({ baseURL, accessToken, imageBlob: blob });
      return {
        fileId,
        width: video.videoWidth || 0,
        height: video.videoHeight || 0,
        size: blob.size,
        reason
      };
    }

    async function captureSpeechFrame() {
      if (!speechModeActive || !videoEnabled) return;
      if (speechFrameInFlight) return;
      speechFrameInFlight = true;
      try {
        const frame = await captureAndUploadCurrentFrame('speech_loop');
        speechUploadedFrameIds.push(frame.fileId);
        if (speechUploadedFrameIds.length > SPEECH_MAX_FRAMES) {
          speechUploadedFrameIds.shift();
        }
        appendDebugRecord('speech_frame_uploaded', {
          reason: frame.reason,
          width: frame.width,
          height: frame.height,
          size: frame.size,
          fileId: frame.fileId,
          frameBufferSize: speechUploadedFrameIds.length
        });
        updateCheck('check6', 'pass');
      } catch (e) {
        appendDebugRecord('speech_frame_upload_error', {
          reason: 'speech_loop',
          error: String(e?.message || e)
        });
        log(`语音抓帧或上传失败: ${e.message || e}`, 'warning');
      } finally {
        speechFrameInFlight = false;
      }
    }

    function startSpeechFrameLoop() {
      if (!autoVisionEnabled || !videoEnabled) return;
      if (speechModeActive) return;
      resetSpeechCaptureState();
      speechModeActive = true;
      void captureSpeechFrame(); // speech started instant frame
      speechFrameTimer = setInterval(() => {
        void captureSpeechFrame();
      }, SPEECH_FRAME_INTERVAL_MS);
      log('检测到用户说话，开始 1 秒 1 帧采样并预上传', 'info');
    }

    function scheduleSpeechBundleSend(reason) {
      if (!autoVisionEnabled) return;
      clearSpeechBundleRetryTimer();
      if (speechFlushTimer) clearTimeout(speechFlushTimer);
      const delay = getSpeechBundleDelay(reason);
      appendDebugRecord('speech_bundle_schedule', { reason, delayMs: delay });
      speechFlushTimer = setTimeout(() => {
        speechFlushTimer = null;
        void sendSpeechBundleToAgent(reason);
      }, delay);
    }

    function setAutoVisionEnabled(enabled, { quiet = false } = {}) {
      autoVisionEnabled = !!enabled;
      if (!autoVisionEnabled) resetSpeechCaptureState();
      if (!quiet) {
        log(autoVisionEnabled ? '语音联动视觉已开启' : '语音联动视觉已关闭', 'info');
      }
    }

    function stopFallbackPreview() {
      if (fallbackPreviewStream) {
        fallbackPreviewStream.getTracks().forEach((t) => t.stop());
        fallbackPreviewStream = null;
      }
      const fallbackVideo = document.getElementById('fallback-player');
      if (fallbackVideo) {
        fallbackVideo.pause?.();
        fallbackVideo.srcObject = null;
        fallbackVideo.remove();
      }
    }

    async function logMediaDevices() {
      if (!navigator.mediaDevices?.enumerateDevices) return;
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter((d) => d.kind === 'videoinput');
        const mics = devices.filter((d) => d.kind === 'audioinput');
        log(`设备列表: 摄像头=${cams.length}, 麦克风=${mics.length}`, 'info');
      } catch (e) {
        log(`设备枚举失败: ${e.message || e}`, 'error');
      }
    }

    function getLocalVideoEl() {
      return document.querySelector('#local-player video');
    }

    async function waitForLocalVideo(timeoutMs = 3000) {
      const start = Date.now();
      while (Date.now() - start < timeoutMs) {
        const video = getLocalVideoEl();
        if (video && video.videoWidth > 0 && video.videoHeight > 0) return video;
        await new Promise((r) => setTimeout(r, 100));
      }
      return null;
    }

    async function ensureVisiblePreview() {
      const sdkVideo = await waitForLocalVideo(1800);
      if (sdkVideo) {
        return { video: sdkVideo, source: 'sdk' };
      }

      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error('getUserMedia_not_supported');
      }

      stopFallbackPreview();
      fallbackPreviewStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      const root = document.getElementById('local-player');
      const fallback = document.createElement('video');
      fallback.id = 'fallback-player';
      fallback.autoplay = true;
      fallback.muted = true;
      fallback.playsInline = true;
      fallback.srcObject = fallbackPreviewStream;
      root.innerHTML = '';
      root.appendChild(fallback);
      await fallback.play().catch(() => {});

      const ready = await waitForLocalVideo(1800);
      if (!ready) throw new Error('fallback_preview_not_ready');
      return { video: ready, source: 'fallback' };
    }

    function captureFrameBlob(videoEl) {
      const canvas = document.createElement('canvas');
      canvas.width = videoEl.videoWidth;
      canvas.height = videoEl.videoHeight;
      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('canvas_context_unavailable');
      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('frame_to_blob_failed'));
        }, 'image/jpeg', 0.9);
      });
    }

    async function uploadImageToCoze({ baseURL, accessToken, imageBlob }) {
      appendDebugRecord('upload_start', {
        baseURL,
        imageSize: imageBlob?.size || 0,
        imageType: imageBlob?.type || ''
      });
      const form = new FormData();
      const file = new File([imageBlob], `frame_${Date.now()}.jpg`, { type: 'image/jpeg' });
      form.append('file', file);

      const resp = await fetch(`${baseURL}/v1/files/upload`, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${accessToken}`
        },
        body: form
      });

      const text = await resp.text();
      let json;
      try { json = JSON.parse(text); } catch (_) { json = { raw: text }; }
      if (!resp.ok) {
        appendDebugRecord('upload_error', { status: resp.status, body: text });
        throw new Error(`upload_http_${resp.status}: ${text}`);
      }
      if (json.code != null && json.code !== 0) {
        appendDebugRecord('upload_error', { code: json.code, msg: json.msg || '', body: text });
        throw new Error(`upload_code_${json.code}: ${json.msg || text}`);
      }
      const fileId = json?.data?.id;
      if (!fileId) {
        appendDebugRecord('upload_error', { status: resp.status, body: text, reason: 'missing_file_id' });
        throw new Error(`upload_missing_file_id: ${text}`);
      }
      appendDebugRecord('upload_success', { fileId, status: resp.status });
      return fileId;
    }

    function getAccessConfig() {
      const baseURL = document.getElementById('baseUrl').value;
      const accessToken = document.getElementById('accessToken').value.trim();
      if (!accessToken) throw new Error('missing_access_token');
      return { baseURL, accessToken };
    }

    async function sendObjectStringItems(items) {
      if (!client || typeof client.sendMessage !== 'function') {
        throw new Error('send_message_not_supported');
      }
      if (!Array.isArray(items) || !items.length) {
        throw new Error('empty_message_items');
      }

      const message = {
        id: `msg_${Date.now()}`,
        event_type: 'conversation.message.create',
        data: {
          role: 'user',
          content_type: 'object_string',
          content: JSON.stringify(items)
        }
      };

      appendDebugRecord('send_message', {
        messageId: message.id,
        itemCount: items.length,
        imageCount: items.filter((x) => x?.type === 'image').length,
        hasText: items.some((x) => x?.type === 'text'),
        textPreview: (() => {
          const t = items.find((x) => x?.type === 'text')?.text || '';
          return t.length > 100 ? `${t.slice(0, 100)}...` : t;
        })(),
        fileIds: items.filter((x) => x?.type === 'image').map((x) => x.file_id).filter(Boolean)
      });
      await client.sendMessage(message);
    }

    async function setMicState(enabled, { quiet = false } = {}) {
      if (!client) return false;
      try {
        await client.setAudioEnable(enabled);
        micEnabled = enabled;
        document.getElementById('btnMic').textContent = micEnabled ? '关闭麦克风' : '开启麦克风';
        if (enabled) updateCheck('check4', 'pass');
        if (!quiet) log(enabled ? '麦克风已开启，请直接说话' : '麦克风已关闭', 'info');
        return true;
      } catch (e) {
        log(`${enabled ? '开启' : '关闭'}麦克风失败: ${e.message || e}`, 'error');
        return false;
      }
    }

    async function sendCurrentFrameToAgent({ text = '', reason = 'manual', quiet = false } = {}) {
      if (!client) throw new Error('not_connected');
      if (!videoEnabled) throw new Error('video_not_enabled');

      const { baseURL, accessToken } = getAccessConfig();

      const video = await waitForLocalVideo(2000);
      if (!video) throw new Error('local_video_not_ready');

      const blob = await captureFrameBlob(video);
      const fileId = await uploadImageToCoze({ baseURL, accessToken, imageBlob: blob });
      const items = [{ type: 'image', file_id: fileId }];
      if (text && text.trim()) items.push({ type: 'text', text: text.trim() });
      await sendObjectStringItems(items);
      updateCheck('check6', 'pass');

      if (!quiet) {
        log(`图片帧已发送(${reason}), file_id=${fileId}${text ? ', 含用户文本' : ''}`, 'success');
      }

      return { fileId, size: blob.size };
    }

    async function sendSpeechBundleToAgent(reason = 'speech_stopped') {
      if (!autoVisionEnabled || !client || !videoEnabled) return;
      if (speechBundleInFlight) return;
      const settleStart = Date.now();
      while (speechFrameInFlight && Date.now() - settleStart < SPEECH_UPLOAD_SETTLE_TIMEOUT_MS) {
        await new Promise((r) => setTimeout(r, 80));
      }
      if (speechFrameInFlight) {
        appendDebugRecord('speech_upload_wait_timeout', {
          reason,
          timeoutMs: SPEECH_UPLOAD_SETTLE_TIMEOUT_MS
        });
      }

      let frameFileIds = speechUploadedFrameIds.slice();
      speechUploadedFrameIds = [];
      if (!frameFileIds.length) {
        try {
          const frame = await captureAndUploadCurrentFrame('speech_finalize_fallback');
          frameFileIds.push(frame.fileId);
          appendDebugRecord('speech_frame_uploaded', {
            reason: frame.reason,
            width: frame.width,
            height: frame.height,
            size: frame.size,
            fileId: frame.fileId,
            frameBufferSize: frameFileIds.length
          });
          updateCheck('check6', 'pass');
        } catch (e) {
          appendDebugRecord('speech_bundle_skip', {
            reason,
            because: 'no_frame_file_id',
            error: String(e?.message || e)
          });
        }
      }
      if (!frameFileIds.length) return;

      const userText = (latestCompletedUserSpeechText || currentUserSpeechText || '').trim();
      if (!userText) {
        if (speechBundleRetryCount < SPEECH_BUNDLE_MAX_RETRY) {
          speechBundleRetryCount += 1;
          speechUploadedFrameIds = frameFileIds.slice(-SPEECH_MAX_FRAMES);
          appendDebugRecord('speech_bundle_retry', {
            reason,
            retryCount: speechBundleRetryCount,
            maxRetry: SPEECH_BUNDLE_MAX_RETRY,
            frameCount: speechUploadedFrameIds.length,
            delayMs: SPEECH_BUNDLE_RETRY_DELAY_MS
          });
          log(`未拿到用户语音文本，${SPEECH_BUNDLE_RETRY_DELAY_MS}ms 后重试(${speechBundleRetryCount}/${SPEECH_BUNDLE_MAX_RETRY})`, 'warning');
          clearSpeechBundleRetryTimer();
          speechBundleRetryTimer = setTimeout(() => {
            speechBundleRetryTimer = null;
            void sendSpeechBundleToAgent(`${reason}_retry_${speechBundleRetryCount}`);
          }, SPEECH_BUNDLE_RETRY_DELAY_MS);
          return;
        }
        appendDebugRecord('speech_bundle_fallback', {
          reason,
          frameCount: frameFileIds.length,
          because: 'missing_user_text_after_retry'
        });
        if (assistantStartedAfterSpeech || assistantChatInProgress) {
          log('多次重试后仍无语音文本，检测到 AI 抢答，将中断后发送图片', 'warning');
        } else {
          log('多次重试后仍无语音文本，降级仅发送图片帧', 'warning');
        }
      } else {
        speechBundleRetryCount = 0;
        clearSpeechBundleRetryTimer();
      }
      if (assistantStartedAfterSpeech || assistantChatInProgress) {
        appendDebugRecord('assistant_interrupt_before_bundle', {
          reason,
          frameCount: frameFileIds.length,
          hasUserText: !!userText,
          speechStarted: assistantStartedAfterSpeech,
          chatInProgress: assistantChatInProgress
        });
        try {
          await client.interrupt();
          assistantStartedAfterSpeech = false;
          assistantChatInProgress = false;
          log('检测到 AI 抢答，已中断并等待图文补全后重新回答', 'warning');
        } catch (interruptErr) {
          appendDebugRecord('speech_bundle_skip', {
            reason,
            frameCount: frameFileIds.length,
            because: 'assistant_interrupt_failed',
            error: String(interruptErr?.message || interruptErr)
          });
          log(`AI 抢答中断失败，跳过本轮图文发送: ${interruptErr?.message || interruptErr}`, 'warning');
          return;
        }
      }

      speechBundleInFlight = true;
      try {
        const items = frameFileIds.map((id) => ({ type: 'image', file_id: id }));
        if (userText) {
          items.push({ type: 'text', text: userText });
        }
        await sendObjectStringItems(items);
        updateCheck('check6', 'pass');
        const previewText = userText ? (userText.length > 40 ? `${userText.slice(0, 40)}...` : userText) : '';
        appendDebugRecord('speech_bundle_sent', {
          reason,
          frameCount: frameFileIds.length,
          uploadedFileIds: frameFileIds,
          userTextPreview: previewText,
          mode: userText ? 'image+text' : 'image_only'
        });
        if (userText) {
          log(`语音联动图文已发送(${reason}): ${frameFileIds.length} 张图, 文本="${previewText}"`, 'success');
        } else {
          log(`语音联动图片已发送(${reason}): ${frameFileIds.length} 张图(无文本)`, 'success');
        }
      } catch (e) {
        speechUploadedFrameIds = frameFileIds.slice(-SPEECH_MAX_FRAMES);
        appendDebugRecord('speech_bundle_error', {
          reason,
          frameCount: frameFileIds.length,
          error: String(e?.message || e)
        });
        log(`语音联动图文发送失败(${reason}): ${e.message || e}`, 'error');
      } finally {
        speechBundleRetryCount = 0;
        speechBundleInFlight = false;
        assistantStartedAfterSpeech = false;
      }
    }

    // 初始化 SDK
    async function initSDK() {
      log('正在加载 @coze/realtime-api SDK...');
      try {
        const module = await import('https://esm.sh/@coze/realtime-api@1.3.2');
        RealtimeClient = module.RealtimeClient;
        EventNames = module.EventNames;
        RealtimeUtils = module.RealtimeUtils;
        log('SDK 加载成功!', 'success');
        updateCheck('check1', 'pass');
        return true;
      } catch (e) {
        log(`SDK 加载失败: ${e.message}`, 'error');
        updateCheck('check1', 'fail');
        showConclusion('fail', 'SDK 无法在浏览器中加载，需要考虑替代方案');
        return false;
      }
    }

    // 测试连接
    window.testConnect = async function() {
      const baseURL = document.getElementById('baseUrl').value;
      const accessToken = document.getElementById('accessToken').value.trim();
      const botId = document.getElementById('botId').value.trim();
      const voiceId = document.getElementById('voiceId').value.trim();
      appendDebugRecord('connect_click', {
        baseURL,
        botId,
        hasToken: !!accessToken,
        voiceId: voiceId || ''
      });

      if (!accessToken || !botId) {
        log('请填写 Access Token 和 Bot ID', 'error');
        return;
      }

      // 检查 SDK
      if (!RealtimeClient) {
        const loaded = await initSDK();
        if (!loaded) return;
      }

      // 检查麦克风/摄像头权限
      log('检查麦克风/摄像头权限...');
      try {
        const permission = await RealtimeUtils.checkDevicePermission(true);
        if (permission.audio) {
          log('麦克风权限已获取', 'success');
          updateCheck('check2', 'pass');
        } else {
          log('麦克风权限被拒绝', 'error');
          updateCheck('check2', 'fail');
          return;
        }
        if (permission.video) {
          log('摄像头权限已获取', 'success');
          updateCheck('check2v', 'pass');
        } else {
          log('摄像头权限被拒绝', 'error');
          updateCheck('check2v', 'fail');
          return;
        }
        await logMediaDevices();
      } catch (e) {
        log(`权限检查失败: ${e.message}`, 'error');
        updateCheck('check2', 'fail');
        updateCheck('check2v', 'fail');
        return;
      }

      // 创建客户端
      log('创建 RealtimeClient...');
      updateStatus('connecting');

      try {
        const uidKey = 'coze_realtime_uid';
        let userId = localStorage.getItem(uidKey);
        if (!userId) {
          userId = (globalThis.crypto?.randomUUID?.() || `u_${Date.now()}_${Math.random().toString(16).slice(2)}`);
          localStorage.setItem(uidKey, userId);
        }

        client = new RealtimeClient({
          baseURL,
          accessToken,
          botId,
          voiceId: voiceId || undefined,
          debug: true,
          allowPersonalAccessTokenInBrowser: true,
          audioMutedDefault: true,

          // 关键：realtime-console 示例里会显式带上这些字段（可能影响“视频通话/抽帧”链路）
          connectorId: '1024',
          userId,
          roomMode: 'default',

          videoConfig: {
            renderDom: 'local-player',
            videoOnDefault: true
          }
        });

        // expose for debugging
        window.__rt = { client, EventNames };
        try {
          const videoRelated = Object.entries(EventNames || {}).filter(([k,v]) => String(k).includes('VIDEO') || String(v).toLowerCase().includes('video'));
          log(`EventNames(video): ${videoRelated.map(([k,v])=>`${k}=${v}`).join(', ') || '(none)'}`, 'info');
        } catch (e) {}

        // 监听事件
        client.on(EventNames.CONNECTED, async (e) => {
          appendDebugRecord('connected', { ok: true });
          log('连接成功!', 'success');
          updateCheck('check3', 'pass');
          updateStatus('connected');
          setConnectedButtons(true);

          // 连接后自动尝试开视频，保证 preview 和“视觉链路”尽快可验证。
          try {
            await client.setVideoEnable(true);
            videoEnabled = true;
            document.getElementById('btnVideo').textContent = '关闭视频';
            const { video, source } = await ensureVisiblePreview();
            const sourceLabel = source === 'fallback' ? 'fallback(getUserMedia)' : 'sdk(renderDom)';
            log(`视频预览已就绪: ${video.videoWidth}x${video.videoHeight} (${sourceLabel})`, 'success');
          } catch (err) {
            log(`自动开启 SDK 视频失败: ${err.message || err}`, 'error');
            try {
              const { video } = await ensureVisiblePreview();
              videoEnabled = true;
              document.getElementById('btnVideo').textContent = '关闭视频';
              log(`已切换到 fallback 本地预览: ${video.videoWidth}x${video.videoHeight}`, 'warning');
            } catch (fallbackErr) {
              videoEnabled = false;
              document.getElementById('btnVideo').textContent = '开启视频';
              log(`fallback 预览也失败: ${fallbackErr.message || fallbackErr}`, 'error');
            }
          }

          const micReady = await setMicState(true, { quiet: true });
          if (micReady) {
            log('已进入实时对话模式：麦克风已自动开启', 'success');
          }
        });

        client.on(EventNames.ERROR, (arg1, arg2) => {
          const { eventName, event } = normalizeEventArgs(arg1, arg2, EventNames.ERROR || 'client.error');
          appendDebugRecord('client_error', {
            eventName,
            rawType: typeof event,
            keys: objectKeysSafe(event),
            dataKeys: objectKeysSafe((event && typeof event === 'object') ? event.data : null)
          });
          log(`错误(${eventName}): ${JSON.stringify(event)}`, 'error');
        });

        client.on(EventNames.ALL_SERVER, (arg1, arg2) => {
          const { eventName: dispatchedEventName, event: e } = normalizeEventArgs(arg1, arg2, 'unknown');
          // 注意：该 SDK 事件在某些版本里会直接给一个 string（事件名）
          const t = dispatchedEventName || extractEventType(e) || 'unknown';
          const tn = String(t || '').toLowerCase();
          appendDebugRecord('server_event', {
            type: t,
            dispatchedEventName,
            rawType: typeof e,
            role: extractRoleFromEvent(e),
            keys: objectKeysSafe(e),
            dataKeys: objectKeysSafe((e && typeof e === 'object') ? e.data : null)
          });

          log(`服务器事件: ${t}`, 'event');

          // 如果识别不出类型，打印一个“缩略版对象”方便排查
          if (t === 'unknown') {
            try {
              const preview = {
                keys: objectKeysSafe(e),
                dataKeys: objectKeysSafe((e && typeof e === 'object') ? e.data : null),
                raw: (typeof e === 'string' ? e : JSON.stringify(e || {})).slice(0, 400)
              };
              log(`事件预览: ${JSON.stringify(preview)}`, 'info');
            } catch {}
          }

          // 对于 string 事件名：用前缀判断
          if (typeof t === 'string') {
            if (t.includes('audio.user')) updateCheck('check4', 'pass');
            if (t.includes('audio.agent') || t.includes('conversation.message') || t.includes('response.audio')) updateCheck('check5', 'pass');
            if (tn.includes('audio.user.speech_started')) {
              assistantStartedAfterSpeech = false;
              assistantChatInProgress = false;
              currentUserSpeechText = '';
              latestCompletedUserSpeechText = '';
              speechBundleRetryCount = 0;
              clearSpeechBundleRetryTimer();
              appendDebugRecord('speech_state', { action: 'started', by: 'all_server' });
              if (autoVisionEnabled) startSpeechFrameLoop();
            }
            if (tn.includes('audio.user.speech_stopped')) {
              stopSpeechFrameLoop();
              appendDebugRecord('speech_state', { action: 'stopped', by: 'all_server' });
              if (autoVisionEnabled) scheduleSpeechBundleSend('speech_stopped');
            }
            if (tn.includes('audio.agent.speech_started')) {
              assistantStartedAfterSpeech = true;
              appendDebugRecord('assistant_state', { action: 'speech_started', by: 'all_server' });
            }
            if (tn.includes('conversation.chat.created') || tn.includes('conversation.chat.in_progress')) {
              assistantChatInProgress = true;
              appendDebugRecord('assistant_state', { action: 'chat_in_progress', by: 'all_server', type: t });
            }
            if (tn.includes('conversation.chat.completed') || tn.includes('conversation.chat.failed')) {
              assistantChatInProgress = false;
              appendDebugRecord('assistant_state', { action: 'chat_completed', by: 'all_server', type: t });
            }
          }

          // 对于 object payload（若未来有）：尝试解析文本/音频 delta
          const isTextDelta = tn.includes('conversation.message.delta') || tn.includes('conversation.message.completed');
          const isAudioTranscript = tn.includes('conversation.audio_transcript.delta') || tn.includes('conversation.audio_transcript.completed');
          const isAudioDelta = tn.includes('response.audio.delta') || tn.includes('response.audio.completed');

          if (isAudioTranscript && !hasDirectAudioTranscriptBinding) {
            handleUserTranscriptEvent(e, t, 'all_server');
          }

          if (isTextDelta && !hasDirectConversationMessageBinding) {
            handleConversationMessageEvent(e, t, 'all_server');
          }
          if (isAudioDelta) {
            updateCheck('check5', 'pass');
          }
        });

        if (EventNames.AUDIO_USER_SPEECH_STARTED) {
          client.on(EventNames.AUDIO_USER_SPEECH_STARTED, () => {
            assistantStartedAfterSpeech = false;
            assistantChatInProgress = false;
            currentUserSpeechText = '';
            latestCompletedUserSpeechText = '';
            speechBundleRetryCount = 0;
            clearSpeechBundleRetryTimer();
            appendDebugRecord('speech_state', { action: 'started', by: 'event_name' });
            if (autoVisionEnabled) startSpeechFrameLoop();
          });
        }
        if (EventNames.AUDIO_USER_SPEECH_STOPPED) {
          client.on(EventNames.AUDIO_USER_SPEECH_STOPPED, () => {
            stopSpeechFrameLoop();
            appendDebugRecord('speech_state', { action: 'stopped', by: 'event_name' });
            if (autoVisionEnabled) scheduleSpeechBundleSend('speech_stopped_event');
          });
        }
        if (EventNames.AUDIO_AGENT_SPEECH_STARTED) {
          client.on(EventNames.AUDIO_AGENT_SPEECH_STARTED, () => {
            assistantStartedAfterSpeech = true;
            appendDebugRecord('assistant_state', { action: 'speech_started', by: 'event_name' });
          });
        }

        const directAudioTranscriptBindings = bindEventNamesByPattern({
          label: 'direct_audio_transcript',
          patterns: [
            'conversation.audio_transcript.delta',
            'conversation.audio_transcript.completed',
            'audio_transcript.delta',
            'audio_transcript.completed'
          ],
          handler: (evt, eventName, source) => {
            handleUserTranscriptEvent(evt, extractEventType(evt) || eventName, source);
          }
        });
        hasDirectAudioTranscriptBinding = directAudioTranscriptBindings.length > 0;

        const directConversationMessageBindings = bindEventNamesByPattern({
          label: 'direct_conversation_message',
          patterns: [
            'conversation.message.delta',
            'conversation.message.completed'
          ],
          handler: (evt, eventName, source) => {
            handleConversationMessageEvent(evt, extractEventType(evt) || eventName, source);
          }
        });
        hasDirectConversationMessageBinding = directConversationMessageBindings.length > 0;

        client.on(EventNames.AUDIO_UNMUTED, () => {
          log('麦克风已开启（AUDIO_UNMUTED）', 'success');
          updateCheck('check4', 'pass');
        });

        // 连接
        log('正在连接...');
        await client.connect();

      } catch (e) {
        log(`连接失败: ${e.message}`, 'error');
        updateCheck('check3', 'fail');
        updateStatus('disconnected');
        showConclusion('fail', `连接失败: ${e.message}`);
      }
    };

    // 断开连接
    window.testDisconnect = async function() {
      if (client) {
        appendDebugRecord('disconnect_click', { connected: true });
        log('断开连接...');
        await client.disconnect();
        client = null;
        resetSpeechCaptureState();
        latestCompletedUserSpeechText = '';
        stopFallbackPreview();
        updateStatus('disconnected');
        setConnectedButtons(false);
        document.getElementById('btnVideo').textContent = '开启视频';
        videoEnabled = false;
        micEnabled = false;
        document.getElementById('btnMic').textContent = '开启麦克风';
        log('已断开', 'info');

        // 检查结果
        const checks = ['check1', 'check2', 'check2v', 'check3', 'check4', 'check5', 'check6'];
        const passed = checks.filter(id =>
          document.getElementById(id).classList.contains('pass')
        ).length;

        if (passed >= 5) {
          showConclusion('success', `验证通过 (${passed}/7)，音视频+视觉链路基本可用`);
        } else if (passed >= 3) {
          showConclusion('warning', `部分验证通过 (${passed}/7)，需要继续排查视觉链路`);
        } else {
          showConclusion('fail', `验证失败 (${passed}/7)，建议优先用“抓拍发送”方式验证视觉能力`);
        }
      }
    };

    // 切换麦克风
    window.toggleMic = async function() {
      if (!client) return;
      await setMicState(!micEnabled);
    };

    // 切换视频
    window.toggleVideo = async function() {
      if (!client) return;
      videoEnabled = !videoEnabled;
      try {
        log(`setVideoEnable(${videoEnabled})...`, 'info');
        await client.setVideoEnable(videoEnabled);
        document.getElementById('btnVideo').textContent = videoEnabled ? '关闭视频' : '开启视频';
        if (videoEnabled) {
          const { video, source } = await ensureVisiblePreview();
          const sourceLabel = source === 'fallback' ? 'fallback(getUserMedia)' : 'sdk(renderDom)';
          log(`视频已开启: ${video.videoWidth}x${video.videoHeight} (${sourceLabel})`, 'success');
        } else {
          resetSpeechCaptureState();
          stopFallbackPreview();
          log('视频已关闭', 'info');
        }
      } catch (e) {
        log(`视频切换失败: ${e.message || e}`, 'error');
        if (videoEnabled) {
          // SDK 开视频失败时，仍尝试 fallback，便于继续做“抓拍发送”调试。
          try {
            const { video } = await ensureVisiblePreview();
            videoEnabled = true;
            document.getElementById('btnVideo').textContent = '关闭视频';
            log(`已切换到 fallback 本地预览: ${video.videoWidth}x${video.videoHeight}`, 'warning');
            return;
          } catch (fallbackErr) {
            log(`fallback 预览失败: ${fallbackErr.message || fallbackErr}`, 'error');
          }
        }
        videoEnabled = !videoEnabled;
        document.getElementById('btnVideo').textContent = videoEnabled ? '关闭视频' : '开启视频';
      }
    };

    // 抓拍一帧并作为 image 消息发给智能体（用于验证视觉理解）
    window.captureAndSendFrame = async function() {
      if (!client) {
        log('尚未连接，无法发送图片', 'error');
        return;
      }
      if (!videoEnabled) {
        log('请先开启视频，再抓拍发送', 'error');
        return;
      }

      try {
        log('正在抓拍当前画面...', 'info');
        const text = (latestCompletedUserSpeechText || currentUserSpeechText || '').trim();
        await sendCurrentFrameToAgent({ text, reason: 'manual' });
      } catch (e) {
        log(`抓拍发送失败: ${e.message || e}`, 'error');
        updateCheck('check6', 'fail');
      }
    };

    // 显示结论
    function showConclusion(type, message) {
      const el = document.getElementById('conclusion');
      el.innerHTML = `<div class="result-box ${type}">${message}</div>`;
    }

    // 页面加载时初始化
    window.addEventListener('load', async () => {
      log('POC 页面已加载');
      const isSecureLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (location.protocol !== 'https:' && !isSecureLocalhost) {
        log('当前不是安全上下文（HTTPS/localhost），摄像头可能无法工作', 'error');
      }
      const autoVisionEl = document.getElementById('autoVision');
      autoVisionEnabled = !!autoVisionEl?.checked;
      autoVisionEl?.addEventListener('change', (evt) => {
        setAutoVisionEnabled(!!evt.target.checked);
      });
      if (!autoVisionEnabled) {
        log('语音联动视觉已关闭', 'info');
      } else {
        log('语音联动视觉已开启：说话时将按 1 秒 1 帧采样', 'info');
      }
      setConnectedButtons(false);
      await initSDK();
    });
  </script>
</body>
</html>
