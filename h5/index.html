<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MiniExplorer H5 (POC Runtime)</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f1115;
    }
    .shell {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #0f1115;
    }
    .bar {
      height: 44px;
      flex: 0 0 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b8c0cc;
      font: 600 13px -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif;
      letter-spacing: 0.2px;
      background: #161b22;
      border-bottom: 1px solid #222a33;
    }
    .frame-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
    }
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #0f1115;
    }
    .fallback {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #d8dee9;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif;
      padding: 24px;
    }
    .fallback a {
      color: #7ec8ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="bar">H5 Runtime: Using POC Implementation</div>
    <div class="frame-wrap">
      <iframe id="pocFrame" allow="camera; microphone; autoplay; fullscreen"></iframe>
      <div class="fallback" id="fallback">
        <div>
          无法加载 POC 页面，请直接打开
          <a id="pocLink" href="#">/poc/coze-realtime-poc.html</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const iframe = document.getElementById('pocFrame');
      const fallback = document.getElementById('fallback');
      const pocURL = new URL('../poc/coze-realtime-poc.html', location.href);
      const pocHref = pocURL.toString();
      const link = document.getElementById('pocLink');
      link.href = pocHref;
      link.textContent = pocHref;

      iframe.src = pocHref;
      iframe.addEventListener('error', () => {
        fallback.style.display = 'flex';
      });
    })();
  </script>
</body>
</html>
